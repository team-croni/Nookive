version: 2
updates:
  # Minor/patch updates arrive as one grouped PR per ecosystem each month.
  # Major updates still open separate PRs so breaking changes are reviewed one by one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node type definitions on the Node version CI runs (22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
